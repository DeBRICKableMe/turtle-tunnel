<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Content — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-side">
    <div style="font-family:var(--font-display); font-weight:600; font-size:1.1rem; margin-bottom:24px;">Turtle Watch Admin</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="reports.html">Reports</a>
    <a href="content.html" class="active">Site Content</a>
    <a href="#" id="logout-link" style="margin-top:24px; color:#E3B79A;">Log Out</a>
  </aside>
  <main class="admin-main">
    <h1>Site Content</h1>
    <p>Edit text shown on the public site without touching any code. Leave a box blank to fall back to the site's default wording.</p>

    <div id="content-msg"></div>

    <div class="card" style="margin-bottom:20px;">
      <h3>Homepage — 100-report goal paragraph</h3>
      <div class="field">
        <textarea id="text-home_goal_text" rows="4"></textarea>
      </div>
      <button class="btn btn-primary" data-key="home_goal_text">Save</button>
    </div>

    <div class="card">
      <h3>Findings page — intro paragraph</h3>
      <div class="field">
        <textarea id="text-findings_intro" rows="4"></textarea>
      </div>
      <button class="btn btn-primary" data-key="findings_intro">Save</button>
    </div>
  </main>
</div>

<script type="module" src="js/admin-content.js"></script>
</body>
</html>
