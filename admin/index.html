<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Licking County Turtle Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <h2 style="margin-bottom:4px;">Admin Login</h2>
    <p style="margin-bottom:24px;">Team access only.</p>
    <div id="login-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="login-btn">Log In</button>
    </form>
  </div>
</div>

<script type="module" src="js/admin-login.js"></script>
</body>
</html>
