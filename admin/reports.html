<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-side">
    <div style="font-family:var(--font-display); font-weight:600; font-size:1.1rem; margin-bottom:24px;">Turtle Watch Admin</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="reports.html" class="active">Reports</a>
    <a href="content.html">Site Content</a>
    <a href="#" id="logout-link" style="margin-top:24px; color:#E3B79A;">Log Out</a>
  </aside>
  <main class="admin-main">
    <h1>Reports</h1>

    <div class="tabs">
      <button data-status="pending" class="active">Pending</button>
      <button data-status="approved">Approved</button>
      <button data-status="rejected">Rejected</button>
      <button data-status="all">All</button>
    </div>

    <table class="reports-table" id="reports-table">
      <thead><tr><th>Submitted</th><th>Status</th><th>Location</th><th>Road Position</th><th>Condition</th></tr></thead>
      <tbody><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>

    <div id="detail-panel"></div>
  </main>
</div>

<script type="module" src="js/admin-reports.js"></script>
</body>
</html>
